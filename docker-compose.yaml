services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cvanalyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./.env
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embeddings
      - DATABASE_URL=postgresql://cv:cv@db:5432/cvanalyzer
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${APP_PORT:-8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: